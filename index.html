<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Island Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Familjen+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout (docs: "Island Sim UI Design"): the atoll fills the screen; a lacquer top bar, the charter card top right,
   advisor feed on the left, minimap bottom left, build bar bottom centre, selection panel bottom right.
   Look: lacquered teak and whitewashed coral, trimmed with liyelaa jehun lacquer bands. */
:root{
  --lacquer:#1c1714; --teak:#5a3a24; --ochre:#d9a441; --red:#a3362a; --coral:#f2ece0; --coral-2:#e6dccb;
  --lagoon:#2fb7a8; --deep:#134a5e; --good:#5fae5a; --warn:#e0a33a; --bad:#d0533f;
  --ink:var(--lacquer); --ink-2:#4a3d33;
  --band:linear-gradient(var(--red) 0 34%,var(--lacquer) 34% 66%,var(--ochre) 66%);
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ui:1;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:#8fc9dc}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:currentColor;fill-rule:evenodd}
.num{font-variant-numeric:tabular-nums}
#hud{position:absolute;inset:0;pointer-events:none;zoom:var(--ui)}
#hud > *{pointer-events:auto}

/* panels: coral-white face, teak frame, lacquer band under the heading */
.pnl{background:var(--coral);color:var(--ink);border:3px solid var(--teak);border-radius:6px;box-shadow:0 6px 18px rgba(28,16,6,.32)}
.pnl > h2,.pnl .hd h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;color:var(--lacquer)}
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px 7px;position:relative}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:6px;background:var(--band)}
.hd .x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;padding:0 4px;color:var(--ink-2)}
.sub{color:var(--deep);font-size:13px}
.slide{animation:slide .16s ease-out}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* top resource bar */
#top{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--lacquer);color:var(--coral);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--band)}
#top .grp{display:flex;align-items:center;gap:10px}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;border:1px solid transparent;background:none;color:var(--ochre);position:relative}
.ib:hover{border-color:var(--ochre)}
.ib[aria-expanded="true"]{background:color-mix(in srgb,var(--ochre) 22%,transparent)}
.badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:16px}
.day{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.day svg{color:var(--ochre)}
.speed{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:999px;padding:2px}
.speed button{border:0;background:none;border-radius:999px;padding:3px 9px;font-size:13px;color:var(--coral);min-width:32px}
.speed button[aria-pressed="true"]{background:var(--ochre);color:var(--lacquer);font-weight:700}
#res{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow:hidden}
.ctr{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:15px;white-space:nowrap;border:0;background:none;color:var(--coral)}
.ctr svg{color:var(--ochre)}
.ctr b{font-weight:500;font-variant-numeric:tabular-nums;min-width:2ch}
.ctr .tr{font-size:12px;font-style:normal;font-variant-numeric:tabular-nums;color:#b9ad9a}
.ctr .tr.up{color:#8fd48a} .ctr .tr.dn{color:#f08a76}
.ctr:hover{background:rgba(255,255,255,.08)}
.ctr.out{background:color-mix(in srgb,var(--bad) 35%,transparent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:color-mix(in srgb,var(--bad) 10%,transparent)}}
.isl-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;margin-right:4px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ochre) 60%,transparent);background:none;color:var(--coral);font-family:var(--f-display);font-size:15px;white-space:nowrap}
.sep{width:1px;height:22px;background:rgba(242,236,224,.18);margin:0 4px}

/* popovers from the top bar */
.pop{position:absolute;top:56px;width:250px;padding:0 0 10px;z-index:4}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 0;font-size:14px}
.pop .mi{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:8px 12px;text-align:left;font-size:14px}
.pop .mi:hover{background:var(--coral-2)}
.pop .mi kbd{margin-left:auto}
.segc{display:flex;gap:2px;background:var(--coral-2);border-radius:999px;padding:2px}
.segc button{border:0;background:none;border-radius:999px;padding:3px 9px;font-size:13px}
.segc button[aria-pressed="true"]{background:var(--teak);color:var(--coral)}
kbd{font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--ink-2);border:1px solid #c9bca6;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fbf8f2}
#menu{left:8px;width:290px}
.saves{border-top:1px solid var(--coral-2);margin-top:6px;padding:8px 12px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.saves .slot{display:flex;align-items:center;gap:6px}
.saves .slot span{flex:1;color:var(--deep)}
.saves .slot b{color:var(--ink);font-weight:700}
.saves button{border:1.5px solid var(--teak);background:#fbf8f2;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.saves button:disabled{opacity:.4;cursor:default}
#over{position:absolute;inset:0;background:rgba(12,8,4,.6);display:grid;place-items:center;z-index:8}
#over .box{width:min(420px,calc(100% - 32px))}
#over .body{padding:12px 14px 14px}
#over p{margin:0 0 10px;font-size:14px;line-height:1.45} #settings{right:8px} #log{right:48px;width:320px;max-height:60vh;overflow:auto}

/* charter card */
#charter{position:absolute;top:60px;right:12px;width:270px}
#charter .body{padding:10px 12px 12px}
#charter .goal{font-weight:700;font-size:14px;line-height:1.3}
#charter .why{font-size:12.5px;color:var(--deep);margin-top:3px;line-height:1.35}
.bar{height:8px;border-radius:999px;background:var(--coral-2);overflow:hidden;margin-top:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.bar > i{display:block;height:100%;background:var(--lagoon);border-radius:999px;transition:width .3s}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--deep);margin-top:3px}
#charter ol{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--coral-2);display:flex;flex-direction:column;gap:5px;font-size:12.5px}
#charter li{display:flex;gap:6px;align-items:flex-start}
#charter li::before{content:"";flex:none;width:12px;height:12px;margin-top:2px;border-radius:50%;border:1.5px solid var(--ink-2)}
#charter li.done{color:#7b6f62;text-decoration:line-through} #charter li.done::before{background:var(--lagoon);border-color:var(--lagoon)}
#charter li.now::before{border-color:var(--ochre);background:color-mix(in srgb,var(--ochre) 40%,transparent)}
#charter.won{animation:won .9s ease-out}
@keyframes won{30%{box-shadow:0 0 0 6px var(--ochre),0 6px 18px rgba(28,16,6,.32)}}

/* advisor feed */
#advisor{position:absolute;top:60px;left:12px;width:310px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.msg{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;pointer-events:auto;text-align:left;width:100%;box-sizing:border-box;font-size:13.5px;line-height:1.35;transition:opacity .6s}
.msg.fade{opacity:0}
.msg.bad{border-color:var(--red)} .msg.good{border-color:#3c7d5f}
.msg .who{font-family:var(--f-display);font-size:12px;color:var(--deep);display:block}
.msg.go{cursor:pointer}
.portrait{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ochre);border:2px solid var(--teak);overflow:hidden}
.portrait svg{width:100%;height:100%;display:block}
#log .item{display:flex;gap:8px;padding:7px 12px;font-size:13px;line-height:1.35;border-bottom:1px solid var(--coral-2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
#log .item .d{flex:none;color:var(--deep);font-size:12px;min-width:44px}
#log .item.bad{color:#8c2a1f}

/* minimap and compass */
#mapbox{position:absolute;left:12px;bottom:12px;width:230px;padding:6px}
#mini{display:block;width:100%;aspect-ratio:720/500;height:auto;border-radius:3px;background:var(--deep);cursor:pointer;touch-action:none;image-rendering:pixelated}
.compass{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:6px}
.cb{width:36px;height:30px;border-radius:6px;border:1px solid #c9bca6;background:#fbf8f2;color:var(--ink);display:grid;place-items:center;font-size:17px;padding:0}
.cb:hover{border-color:var(--teak)}
#north{width:44px;height:44px;border-radius:50%;border:2px solid var(--teak);background:var(--lacquer);color:var(--coral);position:relative}
#north span{position:absolute;inset:0;display:grid;place-items:center;transition:transform .05s linear}
#north svg{width:30px;height:30px}
#mapToggle{display:none}

/* build bar and build cards */
#build{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 24px - 2*210px)}
#bar{display:flex;align-items:stretch;gap:2px;padding:4px;background:var(--lacquer);border-color:var(--teak)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:5px 6px 4px;border:0;border-radius:4px;background:none;color:var(--coral);font-size:11.5px;position:relative}
.tab svg{width:26px;height:26px;color:var(--ochre)}
.tab kbd{position:absolute;top:2px;right:3px;background:none;border:0;color:#9d907e;padding:0;font-size:10px}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-pressed="true"]{background:var(--ochre);color:var(--lacquer)}
.tab[aria-pressed="true"] svg{color:var(--lacquer)}
.tab.danger svg{color:#f08a76}
.tab.danger[aria-pressed="true"]{background:var(--red);color:var(--coral)} .tab.danger[aria-pressed="true"] svg{color:var(--coral)}
.bsep{width:1px;background:rgba(242,236,224,.16);margin:4px 3px}
#cards{display:flex;gap:6px;padding:6px;align-items:stretch;overflow-x:auto;max-width:100%;box-sizing:border-box}
.card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:3px;align-items:center;min-width:150px;padding:7px 10px 7px 8px;border:1.5px solid #d3c6b0;border-radius:6px;background:#fbf8f2;text-align:left;position:relative}
.card svg.i{width:32px;height:32px;grid-row:span 2;color:var(--teak)}
.card .nm{font-weight:700;font-size:14px;white-space:nowrap;padding-right:16px}
.card kbd{position:absolute;top:5px;right:6px}
.card:hover{border-color:var(--teak)}
.card[aria-pressed="true"]{border-color:var(--ochre);box-shadow:inset 0 0 0 2px var(--ochre);background:#fff6e2}
.chips{display:flex;gap:4px;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 7px 1px 4px;background:var(--coral-2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg.i{width:13px;height:13px;color:var(--teak);grid-row:auto}
.chip.no{background:color-mix(in srgb,var(--bad) 22%,#fff);color:#8c2a1f}
.brushes{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 4px 0 8px;border-left:1px solid var(--coral-2)}
.brushes .lbl2{font-size:11px;color:var(--deep)}

/* selection and island panels */
#sel{position:absolute;right:12px;bottom:12px;width:330px;max-height:calc(100% - 140px);overflow:auto}
#sel .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
#sel .hd svg.i{width:30px;height:30px;color:var(--teak)}
#sel .hd .t{display:flex;flex-direction:column}
#sel .hd .t small{font-size:12px;color:var(--deep)}
.status{font-size:13.5px;display:flex;gap:6px;align-items:center}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.status.warn::before{background:var(--warn)} .status.bad::before{background:var(--bad)}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:#fbf8f2;border:1px solid var(--coral-2);border-radius:6px}
.flow .node{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-width:54px;text-align:center}
.flow .node svg.i{width:26px;height:26px;color:var(--teak)}
.flow .node b{font-size:13px;font-variant-numeric:tabular-nums}
.flow .node.me svg.i{width:34px;height:34px;color:var(--lacquer)}
.flow .arr{color:#a4977f;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.kv .k{color:var(--deep)}
.kv .bar{margin:0}
.need{display:flex;gap:6px;flex-wrap:wrap}
.need span{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;font-size:12.5px;background:var(--coral-2)}
.need span.ok{background:color-mix(in srgb,var(--good) 25%,#fff)} .need span.no{background:color-mix(in srgb,var(--bad) 22%,#fff)}
.need svg.i{width:15px;height:15px}
.acts{display:flex;gap:8px}
.rename{width:100%;box-sizing:border-box;font-family:var(--f-display);font-size:17px;color:var(--lacquer);padding:2px 6px;border:1.5px solid var(--teak);border-radius:5px;background:#fff}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:6px;border:1.5px solid var(--teak);background:#fbf8f2;font-size:13.5px;font-weight:700}
.btn:hover{background:#fff}
.btn.red{border-color:var(--red);color:var(--red)} .btn.go{background:var(--lagoon);border-color:#1f8a7e;color:#fff}
.btn svg.i{width:16px;height:16px}
.stock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stock .g{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;background:#fbf8f2;border:1px solid var(--coral-2);border-radius:6px;font-size:12px}
.stock .g svg.i{color:var(--teak)}
.stock .g b{font-size:15px;font-variant-numeric:tabular-nums}
.stock .g .tr{font-size:11.5px;color:#7b6f62} .stock .g .tr.up{color:#3c7d3a} .stock .g .tr.dn{color:#b33a2a}
.stock .g.out{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,#fff)}
.boat{font-size:13px;display:flex;gap:6px;align-items:center}

/* floating island names: click for the island panel */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:16px;color:#fffaf0;text-shadow:0 1px 3px rgba(0,30,50,.8),0 0 12px rgba(0,30,50,.5);white-space:nowrap;letter-spacing:.03em;pointer-events:auto;cursor:pointer;background:none;border:0;padding:2px 6px}
.lbl:hover{text-decoration:underline;text-underline-offset:4px}
.lbl.atl{font-size:22px;letter-spacing:.12em;text-transform:uppercase;opacity:.92}

/* cursor tag and tooltips */
#tag{position:absolute;pointer-events:none;transform:translate(16px,14px);padding:5px 9px;font-size:13px;line-height:1.35;max-width:260px;background:var(--coral);border:2px solid var(--teak);border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:5}
#tag .t{font-weight:700}
#tag.bad{border-color:var(--red)} #tag .why{color:#8c2a1f}
#tag .chips{margin-top:3px}
#tip{position:absolute;pointer-events:none;width:270px;padding:9px 11px;font-size:13px;line-height:1.4;z-index:6;background:var(--coral);border:2px solid var(--teak);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#tip .t{font-family:var(--f-display);font-size:16px}
#tip .k{color:var(--deep)}
#tip hr{border:0;border-top:1px solid var(--coral-2);margin:6px 0}

/* help overlay (F1) */
#help{position:absolute;inset:0;background:rgba(12,8,4,.62);z-index:8;color:var(--coral)}
#help .note{position:absolute;max-width:240px;font-size:13.5px;line-height:1.4;padding:8px 10px;background:var(--lacquer);border:2px solid var(--ochre);border-radius:6px}
#help .note b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--ochre);display:block}
#help .keys{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--coral);color:var(--ink);padding:0 0 12px}
#help table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
#help td{padding:4px 12px;border-bottom:1px solid var(--coral-2)}
#help td:first-child{white-space:nowrap;width:1%}
#help .close{display:block;margin:10px auto 0;font-size:13px;color:var(--deep);text-align:center}

#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(4,22,34,.3))}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--lacquer);color:var(--coral);z-index:9}
@media (prefers-reduced-motion:reduce){.slide,#charter.won,.ctr.out{animation:none}.msg{transition:none}}

/* 768–1279: icon-only cards, narrower selection panel, charter on one line */
@media (max-width:1279px){
  .card{grid-template-columns:auto;min-width:0;justify-items:center;padding:6px 8px}
  .card .nm{display:none}
  .card svg.i{grid-row:auto}
  #sel{width:290px}
  #charter{width:230px}
  #charter .why,#charter ol{display:none}
  #build{max-width:calc(100% - 24px - 2*196px)}
  .tab{min-width:52px;font-size:10.5px}
  .ctr{padding:4px 6px;font-size:14px}
  .ctr .tr{display:none}
  .isl-chip{font-size:14px}
}
@media (max-width:1000px){ .day span.dl{display:none} #advisor{width:250px} }
/* phones: gold, residents and the scarcest good; build bar is a bottom sheet; minimap behind a button */
@media (max-width:767px){
  #top{gap:4px;padding:0 4px}
  #top .grp{gap:4px}
  .day{display:none}
  .ib{width:30px}
  .speed button{padding:3px 6px;min-width:26px}
  .speed button[data-speed="3"],.speed button[data-speed="6"]{display:none}
  #res{justify-content:flex-start}
  .ctr:not(.keep){display:none}
  .isl-chip,.sep{display:none}
  #build{left:0;right:0;bottom:0;transform:none;max-width:none;gap:0}
  #bar{width:100%;box-sizing:border-box;border-radius:0;border-width:3px 0 0;overflow-x:auto;justify-content:flex-start}
  .tab{min-width:56px}
  #cards{width:100%;border-radius:0;border-width:3px 0 0}
  #mapbox{bottom:84px;left:8px;width:auto;padding:4px}
  #mapbox #mini{width:200px}
  #mapbox:not(.open) #mini{display:none}
  #mapbox:not(.open) .compass{margin-top:0}
  #mapToggle{display:grid}
  #sel{left:8px;right:8px;width:auto;bottom:84px;max-height:50%}
  #charter{top:56px;right:8px;width:190px}
  #advisor{top:120px;left:8px;width:calc(100% - 16px)}
  .lbl{font-size:13px}
}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="3D view of the atoll"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="hud">
    <header id="top">
      <div class="grp">

  const faros=ATOLLS.map((A,ai)=>{if(A.lone)return[];const r=rng(A.seed*101),out=[];
    for(let k=0;k<(A.faros||0);k++){const a=r()*360,fr=(3+r()*3.5)*SC,c=atollWorld(A,a,rimR(A,a)*(.2+r()*.55));out.push({x:c.x,y:c.y,r:fr})}
    for(const k of ISL_BY_ATOLL[ai]){const I=ISL[k];if(I.off>15*SC){const c=islCentre(I);out.push({x:c.x,y:c.y,r:I.rw+3.5*SC})}}
    return out});
  const lakes=[0,180].map(a=>atollWorld(ATOLLS[3],a,ATOLLS[3].R*.45));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    // domain-warp the coordinates so edges meander instead of tracing arcs
    const wx=x+(fbm(x/SC*.035,y/SC*.035,40)-.5)*12*SC, wy=y+(fbm(x/SC*.035,y/SC*.035,41)-.5)*12*SC;
    let ai=-1,L=null,r=1e9;
    for(let k=0;k<ATOLLS.length;k++){if(!nearAtoll(k,wx,wy))continue;const A=ATOLLS[k],l=atollLocal(A,wx,wy);const rr=(l.d-(A.lone?A.R:rimR(A,l.a)))*l.sc;if(rr<r){r=rr;ai=k;L=l}}
    const i=idx(x,y);if(ai<0){h[i]=MINH;continue}   // open ocean, far from every atoll
    const A=ATOLLS[ai],a=L.a;
    let v=-3,owner=255,g=0,best=1e9;
    if(A.lone){
      // one island, its own narrow reef, then straight down into the ocean
      const rr=r+(fbm(x/SC*.12,y/SC*.12,90)-.5)*3*SC;
      if(rr<0){const t=Math.min(1,-rr/(10*SC));v=Math.min(1.3,-1+3.4*Math.pow(t,.5)+(fbm(x/SC*.3,y/SC*.3,91)-.5)*.4);owner=LONE_ISL;best=0}
      else if(rr<3*SC)v=-1;else if(rr<4.5*SC)v=-2;
      if(owner!==255)for(const c of lakes){const dd=Math.hypot(x-c.x,y-c.y)+(fbm(x/SC*.3,y/SC*.3,92)-.5)*1.2*SC;
        if(dd<2.4*SC){v=-1;g=GT.pond}else if(dd<4.2*SC&&v>=0){v=0;g=GT.kulhi}}
    }else{
      const inner=(-2.5-fbm(a*.05,ai,42)*4)*SC, outer=(6+fbm(a*.05,ai+2,43)*6)*SC; // reef flat width varies around the ring
      if(r>outer+2.5*SC) v=-3;
      else if(r>outer) v=-2;
      else if(r>inner) v=-1;                               // reef flat on the rim
      else{v=-2-(fbm(x/SC*.08,y/SC*.08,6)>.62?1:0);lagoon[i]=1}  // deep lagoon
      if(v<=-2&&r<inner-5*SC&&fbm(x/SC*.21,y/SC*.21,8)>.74) v=-1;   // scattered coral heads (giri)
      if(r<inner-3*SC)for(const f of faros[ai]){const dd=Math.hypot(x-f.x,y-f.y)+(fbm(x/SC*.25,y/SC*.25,9)-.5)*1.6*SC;
        if(dd<f.r){v=dd>f.r-1.8*SC?-1:Math.max(v,f.r<4.5*SC?-1:-2);break}}
      if(v===-1&&Math.abs(r)<2.4*SC&&vnoise(a*.11,3+ai*5,50)>.74) v=0; // sandy motus along the rim
      for(const k of ISL_BY_ATOLL[ai]){const I=ISL[k];
        const da=angDiff(a,I.ang);if(Math.abs(da)>I.ext*1.4+6)continue;
        const rw=I.rw*(.8+.45*fbm(a*.06,k*3,44));
        const u=(r+I.off)/rw;if(Math.abs(u)>1.6)continue;
        const e=Math.hypot(u,da/I.ext)+(fbm(x/SC*.16,y/SC*.16,11+k)-.5)*.5;
        if(I.flats&&r<1&&r>-20*SC&&Math.abs(da)<I.ext+10&&v<-1) v=-1;   // Sugar Cay sits behind broad lagoon flats: too shallow for boats
        if(e>=1.15)continue;
        const t=Math.max(0,1-e),nz=(fbm(x/SC*.3,y/SC*.3,21+k)-.5)*.4;
        // a white beach ring, then flat ground at height 1; only a few ridges reach height 2
        let hv=Math.min(1.3,-1+3.4*Math.pow(t,.5)+nz),kg=0;
        if(I.kind==='vilu'){hv=e<.5?-1.6:Math.min(1.3,-1+3.4*Math.pow(Math.max(0,1-Math.abs(e-.82)/.33),.5)+nz);if(e<.5){if(e<best){best=e;v=e<.32?-2:-1;owner=255}continue}}
        if(I.kind==='finolhu'){hv=Math.min(hv,.4);kg=GT.finolhu}
        if(I.kind==='bird')kg=GT.bird;
        if(I.kind==='kulhi'&&t>.4){const n=fbm(x/SC*.22,y/SC*.22,70+k);if(t>.6&&n>.47){hv=-1;kg=GT.pond}else if(n>.4){hv=0;kg=GT.kulhi}}
        if(I.hills&&t>.35&&fbm(x/SC*.11,y/SC*.11,60+k)>I.hills)hv=2;
        if(kg===GT.pond){if(v<0||owner===k){v=-1;g=kg;owner=255;best=e}continue}
        if(hv>-0.5&&(hv>v||e<best)){v=Math.max(v,hv);if(e<best){best=e;owner=k;g=kg}}  // islands rise straight out of the lagoon
      }
      for(const[pa,hw]of A.passes)if(Math.abs(angDiff(a,pa))<hw&&v<=0&&r>inner-3*SC&&r<outer+3*SC) v=-2; // channels to the ocean
    }
    const hv=Math.max(MINH,Math.min(MAXH,Math.round(v)));
    h[i]=hv;origin[i]=hv>=0?(owner===255?254:owner):255; // 254: reef sand that belongs to no named islandgt[i]=hv>=0||g===GT.pond?g:0;
    if(hv<0&&g!==GT.pond)gt[i]=0;
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);
    // taro in wet ground beside a kulhi; seagrass on the lagoon's shallow flats
    if(h[i]===1&&!gt[i]&&countAround2(gt,x,y,2,GT.kulhi)&&hash2(x,y,71)<.6)gt[i]=GT.taro;
    if(h[i]===-1&&!gt[i]&&(lagoon[i]||lagoonNear(lagoon,x,y))&&fbm(x/SC*.09,y/SC*.09,77)>.55)gt[i]=GT.seagrass;
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=idx(x,y),hv=h[i],f=fbm(x/SC*.22,y/SC*.22,99),o=origin[i],I=o<ISL.length?ISL[o]:null,g=gt[i];
    if(g===GT.kulhi){if(rnd()<.75)tree[i]=3;continue}       // mangroves
    if(g===GT.taro||g===GT.pond)continue;
    const dens=I?(I.dens??KIND_DENS[I.kind]):.5;
    if(hv>=1&&hv<=4&&f>dens) tree[i]=hv<=1&&rnd()<(I&&(I.kind==='wooded'||I.kind==='bird')?.15:.5)?2:1;
    else if(hv===0&&rnd()<(g===GT.finolhu?.015:.12)) tree[i]=2;
  }
  return{h,tree,gt};
}
// open ocean: beyond an atoll's outer reef edge (same warp and reef width as generate), where nothing can be built out
function seaAt(x,y){
  const wx=x+(fbm(x/SC*.035,y/SC*.035,40)-.5)*12*SC, wy=y+(fbm(x/SC*.035,y/SC*.035,41)-.5)*12*SC;
  let ai=0,r=1e9,a=0;
  for(let k=0;k<ATOLLS.length;k++){if(!nearAtoll(k,wx,wy))continue;const A=ATOLLS[k],l=atollLocal(A,wx,wy);const rr=(l.d-(A.lone?A.R:rimR(A,l.a)))*l.sc;if(rr<r){r=rr;ai=k;a=l.a}}
  if(r===1e9)return true;

}
function countAround2(arr,x,y,r,val){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&arr[idx(nx,ny)]===val)return true}return false}
function lagoonNear(lag,x,y){return countAround2(lag,x,y,3,1)}

function newGame(){
  const g=generate();
  S={h:g.h,tree:g.tree,gt:g.gt,road:new Uint8Array(W*H),bld:new Int32Array(W*H).fill(-1),buildings:[],gold:800,t:0,nextId:1,stats:{rum:0,sugarTrip:0},goals:{},capital:0,unrest:0,names:{},over:null};
  computeIslands();
  let best=null,bs=1e9;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=idx(x,y);if(origin[i]!==0||S.h[i]!==0||!berthOf(x,y))continue;
    const A0=ATOLLS[0],s=Math.hypot(x-A0.x,y-A0.y)+Math.abs(angDiff(atollLocal(A0,x,y).a,ISL[0].ang+8))*0.4;
    if(s<bs){bs=s;best=[x,y]}
  }
  if(!best){ // guarantee a berth: take Palm's lagoon-side beach and dredge beside it
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);if(origin[i]!==0||S.h[i]!==0||!adjWater(x,y))continue;const s=Math.hypot(x-ATOLLS[0].x,y-ATOLLS[0].y);if(s<bs){bs=s;best=[x,y]}}
    for(const[dx,dy]of N4){const i=idx(best[0]+dx,best[1]+dy);if(S.h[i]<0)S.h[i]=-2}
  }
  const hb=addBuilding('harbor',best[0],best[1]);
  hb.stock={wood:30,stone:24,fish:40,sugar:0,rum:0};
  S.capital=hb.id;computeIslands();
  for(const type of ['house','house','house','fishery','lumber']){
    let pick=null,pd=1e9;
    for(let y=best[1]-14;y<=best[1]+14;y++)for(let x=best[0]-14;x<=best[0]+14;x++){
      const r=canPlace(type,x,y,true);if(!r.ok)continue;
      const d=Math.hypot(x-best[0],y-best[1]);
      const score=d-(type==='lumber'?countAround(x,y,2,i=>S.tree[i]>0)*0.6:0)-(type==='fishery'?countAround(x,y,2,i=>S.h[i]===-1)*2:0);
      if(score<pd){pd=score;pick=r.fp}
    }
    if(pick){const b=addBuilding(type,pick.x,pick.y,pick.w,pick.d);if(type==='house')b.res=4}
  }

}
function addBuilding(type,x,y,w=1,d=1){miniDirty=true;
  const b={id:S.nextId++,type,x,y,w,d,res:type==='house'?2:0,eff:0,status:'',stock:type==='harbor'?{wood:0,stone:0,fish:0,sugar:0,rum:0}:null};
  S.buildings.push(b);
  for(let ty=y;ty<y+d;ty++)for(let tx=x;tx<x+w;tx++){const i=idx(tx,ty);S.bld[i]=b.id;S.tree[i]=0;S.road[i]=0}
  if(type==='house'){const t=yardPalmTile(b);if(t)S.tree[idx(t[0],t[1])]=2}   // a coconut palm in the yard
  markTrees(x,y,x+w-1,y+d-1);markTerrain(x-1,y-1,x+w,y+d);
  return b;
}
// compounds face their gate along local +z; long plots turn 0/180°, deep plots ±90°
function plotRot(b){const flip=hash2(b.x,b.y,1)<.5?0:Math.PI;return(b.w>=b.d?0:Math.PI/2)+flip}
function plotCentre(b){return{x:b.x+(b.w||1)/2,y:b.y+(b.d||1)/2}}
function yardPalmTile(b){const c=plotCentre(b),r=plotRot(b),lx=1,lz=.5; // front corner opposite the well
  const wx=c.x+lx*Math.cos(r)+lz*Math.sin(r),wz=c.y-lx*Math.sin(r)+lz*Math.cos(r);const tx=Math.floor(wx),ty=Math.floor(wz);
  return inb(tx,ty)&&S.bld[idx(tx,ty)]===b.id?[tx,ty]:null}
const byId=id=>S.buildings.find(b=>b.id===id);
function bAt(x,y){const id=S.bld[idx(x,y)];return id>=0?byId(id):null}

// ---------- islands ----------
function computeIslands(){
  comp=new Int16Array(W*H).fill(-1);islands=[];
  const q=new Int32Array(W*H);
  for(let i=0;i<W*H;i++){if(S.h[i]>=0&&origin[i]===255){const x=i%W,y=(i/W)|0;let bd=1e9,o=0;ISL_C.forEach((c,k)=>{const d=Math.hypot(x-c.x,y-c.y);if(d<bd){bd=d;o=k}});origin[i]=o}}
  for(let s=0;s<W*H;s++){
    if(S.h[s]<0||comp[s]>=0)continue;
    const id=islands.length;let qh=0,qt=0;q[qt++]=s;comp[s]=id;const cnt=new Int32Array(ISL.length);let n=0,sx=0,sy=0;
    while(qh<qt){const c=q[qh++];n++;const o=origin[c];if(o<ISL.length)cnt[o]++;const cx=c%W,cy=(c/W)|0;sx+=cx;sy+=cy;
      for(const[dx,dy]of N4){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const ni=idx(nx,ny);if(S.h[ni]>=0&&comp[ni]<0){comp[ni]=id;q[qt++]=ni}}}
    islands.push({id,n,cnt,s,harbor:null,res:0,jobs:0,eff:1,cx:sx/n,cy:sy/n,atoll:atollAt(sx/n,sy/n)});
  }
  // a named island's name goes to the piece holding most of it; stray fragments are islets
  const owner=ISL.map((_,k)=>{let b=-1,bc=0;for(const isl of islands)if(isl.cnt[k]>bc){bc=isl.cnt[k];b=isl.id}return b});
  for(const isl of islands){const n=isl.n;
    const parts=[];isl.cnt.forEach((c,k)=>{if(owner[k]===isl.id&&c>Math.max(6,n*0.08))parts.push(k)});
    let name=parts.length?parts.map(k=>ISL[k].name.split(' ')[0]).join('–'):'Islet';
    if(parts.length===1)name=ISL[parts[0]].name;
    if(n<12)name='Islet';
    // a player's name sticks to the island's biggest named piece (or, for an islet, its first tile)
    let main=-1;for(const k of parts)if(main<0||isl.cnt[k]>isl.cnt[main])main=k;
    isl.key=main>=0?'k'+main:'t'+isl.s;isl.autoName=name;
    isl.name=S.names?.[isl.key]||name;isl.parts=parts;delete isl.cnt;delete isl.s}
  // each named island's label sits on its land tile nearest the island's centre
  islAnchor=ISL.map(()=>null);const ad=new Float32Array(ISL.length).fill(1e9);
  for(let i=0;i<W*H;i++){const o=origin[i];if(o>=ISL.length||S.h[i]<0)continue;const x=i%W,y=(i/W)|0,c=ISL_C[o],d=Math.hypot(x-c.x,y-c.y);if(d<ad[o]){ad[o]=d;islAnchor[o]={x,y}}}
  const hs=S.buildings.filter(b=>b.type==='harbor').sort((a,b)=>a.id-b.id);
  for(const b of hs){
    const isl=islands[comp[idx(b.x,b.y)]];if(!isl)continue;
    if(!isl.harbor){isl.harbor=b;b.merged=false}
    else{for(const g of GOODS){isl.harbor.stock[g]+=b.stock[g];b.stock[g]=0}b.merged=true}
  }
  for(const b of S.buildings)b.isl=comp[idx(b.x,b.y)];
  syncBoats();
}
const capitalHarbor=()=>byId(S.capital);
const capitalIsland=()=>{const c=capitalHarbor();return c?islands[comp[idx(c.x,c.y)]]:null};
function islandOf(x,y){const c=comp[idx(x,y)];return c>=0?islands[c]:null}
function countAround(x,y,r,fn){let n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny)||(dx===0&&dy===0))continue;if(fn(idx(nx,ny)))n++}return n}
const adjWater=(x,y)=>N4.some(([dx,dy])=>inb(x+dx,y+dy)&&S.h[idx(x+dx,y+dy)]<0);
function berthOf(x,y){for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&S.h[idx(nx,ny)]<=-2)return[nx,ny]}return null}

// ---------- boats ----------
function islandName(b){const isl=islands[comp[idx(b.x,b.y)]];return isl?isl.name:'?'}
function syncBoats(){
  const cap=capitalHarbor(),capIsl=capitalIsland(),keep=[];
  for(const isl of islands){
    const hb=isl.harbor;if(!hb||!cap||isl===capIsl)continue;
    let bt=boats.find(b=>b.home===hb.id);
    if(!bt){const p=berthOf(hb.x,hb.y)||[hb.x,hb.y];bt={home:hb.id,x:p[0],y:p[1],path:null,pi:0,dir:'out',cargo:{},state:'idle',ver:-1,trips:0,ang:0}}
    keep.push(bt);
  }
  for(const b of boats)if(!keep.includes(b)){const hb=byId(b.home);if(hb&&islands[hb.isl]===capIsl)toast(`Land bridge made the ${islandName(hb)} boat unnecessary; goods now move overland.`,'good')}
  boats=keep;
}
function bfsPath(sx,sy,tx,ty){
  if(!inb(sx,sy)||S.h[idx(sx,sy)]>-2)return null;
  const prev=new Int32Array(W*H).fill(-1),q=new Int32Array(W*H);let qh=0,qt=0;const s=idx(sx,sy),t=idx(tx,ty);
  q[qt++]=s;prev[s]=s;
  while(qh<qt){const c=q[qh++];if(c===t)break;const cx=c%W,cy=(c/W)|0;
    for(const[dx,dy]of N4){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const ni=idx(nx,ny);if(prev[ni]<0&&S.h[ni]<=-2){prev[ni]=c;q[qt++]=ni}}}
  if(prev[t]<0)return null;
  const path=[];for(let c=t;c!==s;c=prev[c])path.push([c%W,(c/W)|0]);path.push([sx,sy]);return path.reverse();
}
function planBoat(bt){
  const hb=byId(bt.home),cap=capitalHarbor();bt.ver=terrainVer;
  const hbB=berthOf(hb.x,hb.y),capB=berthOf(cap.x,cap.y);
  if(!hbB){bt.state='blocked';bt.why=`No deep water beside the ${islandName(hb)} harbor`;bt.path=null;return}
  if(!capB){bt.state='blocked';bt.why='No deep water beside the capital harbor';bt.path=null;return}
  let sx=Math.round(bt.x),sy=Math.round(bt.y);
  if(!inb(sx,sy)||S.h[idx(sx,sy)]>-2){
    if(bt.state==='sail'){toast(`The ${islandName(hb)} boat ran aground and lost its cargo.`,'bad',{x:sx,y:sy});bt.cargo={}}
    sx=hbB[0];sy=hbB[1];bt.x=sx;bt.y=sy;bt.dir='out';
  }
  const tgt=bt.dir==='out'?capB:hbB;
  const p=bfsPath(sx,sy,tgt[0],tgt[1]);
  if(!p){bt.state='blocked';bt.path=null;bt.why=`No deep-water route to ${bt.dir==='out'?'the capital':islandName(hb)}. Shallows block boats.`;return}
  bt.path=p;bt.pi=0;bt.state='sail';bt.why='';
}
function unload(to,bt){for(const g in bt.cargo)to.stock[g]+=bt.cargo[g];bt.cargo={}}
function load(from,to,bt){for(const g of GOODS){const amt=Math.min(25,Math.floor((from.stock[g]-to.stock[g])/2));if(amt>0){from.stock[g]-=amt;bt.cargo[g]=amt}}}
function stepBoats(dt){
  if(!capitalHarbor())return;
  for(const bt of boats){
    const hb=byId(bt.home);if(!hb)continue;
    const home=islands[hb.isl]?.harbor,capH=capitalIsland()?.harbor;if(!home||!capH)continue;
    if(bt.ver!==terrainVer)planBoat(bt);
    if(bt.state!=='sail'||!bt.path)continue;
    let move=5*dt;
    while(move>0&&bt.pi<bt.path.length-1){
      const[nx,ny]=bt.path[bt.pi+1];const dx=nx-bt.x,dy=ny-bt.y,d=Math.hypot(dx,dy);
      if(d>0)bt.ang=Math.atan2(dy,dx);
      if(d<=move){bt.x=nx;bt.y=ny;bt.pi++;move-=d}else{bt.x+=dx/d*move;bt.y+=dy/d*move;move=0}
    }
    if(bt.pi>=bt.path.length-1){
      if(bt.dir==='out'){unload(capH,bt);load(capH,home,bt);bt.dir='home'}
      else{unload(home,bt);load(home,capH,bt);bt.dir='out';bt.trips++;if(origin[idx(hb.x,hb.y)]===2)S.stats.sugarTrip++}
      planBoat(bt);
    }
  }
}

// ---------- placement ----------
function stockOf(isl){return isl&&isl.harbor?isl.harbor.stock:null}
// a building's tiles: the hovered tile sits at (or just before) the middle; multi-tile plots may be turned 90°
function footprint(type,x,y,turned){const sz=DEF[type].size;if(!sz)return{x,y,w:1,d:1};const[w,d]=turned?[sz[1],sz[0]]:sz;return{x:x-((w-1)>>1),y:y-((d-1)>>1),w,d}}
function canPlace(type,x,y,free){
  if(!DEF[type].size)return canPlaceAt(type,footprint(type,x,y),free);
  const a=canPlaceAt(type,footprint(type,x,y,false),free);if(a.ok)return a;    // try both ways round
  const b=canPlaceAt(type,footprint(type,x,y,true),free);return b.ok?b:a;
}
function canPlaceAt(type,fp,free){
  const{x,y}=fp,d=DEF[type];
  if(!inb(x,y)||!inb(x+fp.w-1,y+fp.d-1))return{ok:false,why:''};
  const hv=S.h[idx(x,y)];
  for(let ty=y;ty<y+fp.d;ty++)for(let tx=x;tx<x+fp.w;tx++){const i=idx(tx,ty),h=S.h[i];
    if(S.bld[i]>=0)return{ok:false,why:fp.w>1?'The plot overlaps another building':'Tile is occupied'};
    const g=S.gt[i];
    if(g===GT.kulhi||g===GT.pond)return{ok:false,why:'Kulhi wetland. Raise it to fill it in, or leave it as a fish nursery.'};
    if(g===GT.bird)return{ok:false,why:'Birds nest here. The island is protected.'};
    if(g===GT.finolhu&&type!=='fishery'&&type!=='harbor')return{ok:false,why:'Finolhu sand shifts with the monsoon. Only a fishery or harbor can stand here.'};
    if(h<0)return{ok:false,why:'Needs land. Raise this tile first.'};
    if(h<d.h[0]||h>d.h[1])return{ok:false,why:`${d.name} needs height ${d.h[0]}–${d.h[1]} (this tile is ${h})`};
    if(h!==hv)return{ok:false,why:`The ${fp.w}×${fp.d} plot must be level. Use Level first.`}}
  const isl=islandOf(x,y);
  if(type==='harbor'){
    if(!adjWater(x,y))return{ok:false,why:'Harbor must touch the sea'};

  }else{
    if(!isl.harbor)return{ok:false,why:`${isl.name} has no harbor yet. Build one first.`};

function place(type,x,y){

}
function demolish(x,y){

// ---------- sand roads ----------
function buildRoad(x,y){
  if(!inb(x,y))return{ok:false};const i=idx(x,y);

  if(S.gt[i]===GT.kulhi)return{ok:false,why:'Roads cannot cross a kulhi. Fill it in first.'};
  if(S.gt[i]===GT.bird)return{ok:false,why:'Birds nest here. The island is protected.'};
  if(S.bld[i]>=0)return{ok:true};                    // roads simply run up to a building

  S.gold-=2;spend.g+=2;S.road[i]=1;if(S.tree[i])S.tree[i]=0;markTrees(x,y);markTerrain(x,y);return{ok:true};
}
function removeRoad(x,y){if(!inb(x,y))return;const i=idx(x,y);if(!S.road[i])return;S.road[i]=0;S.gold+=1;markTrees(x,y);markTerrain(x,y)}

// ---------- terraforming ----------
function nearestHarborIsland(x,y){let best=null,bd=1e9;for(const isl of islands){const h=isl.harbor;if(!h)continue;const d=Math.abs(h.x-x)+Math.abs(h.y-y);if(d<bd){bd=d;best=isl}}return best}
function terraform(x,y,mode,target){
  if(!inb(x,y))return{ok:false};
  const i=idx(x,y),cur=S.h[i];
  let to=cur;
  if(mode==='raise')to=Math.min(MAXH,cur+1);else if(mode==='lower')to=Math.max(MINH,cur-1);else if(mode==='flatten')to=target;
  if(to===cur)return{ok:true,noop:true};
  const b=bAt(x,y);if(b)return{ok:false,why:`Demolish the ${DEF[b.type].name} before reshaping its tile`};
  if(S.gt[i]===GT.bird)return{ok:false,why:'Birds nest here. The island is protected.'};
  if(cur<=-2&&seaAt(x,y))return{ok:false,why:'Open ocean: too deep to dredge or build out into'};
  const steps=Math.abs(to-cur),up=to>cur;
  const src=nearestHarborIsland(x,y),st=src?.harbor?.stock,gold=4*steps;
  if(S.gold<gold)return{ok:false,why:'Not enough gold to move earth'};
  if(up&&(!st||st.stone<steps))return{ok:false,why:`Need ${steps} stone at ${src?src.name:'a harbor'} to raise land`};
  S.gold-=gold;spend.g+=gold;if(up){st.stone-=steps;spend.s+=steps}else if(st){st.stone+=steps*0.5;spend.s-=steps*0.5}
  const wasLand=cur>=0,isLand=to>=0;

  if(S.gt[i]!==GT.bird)S.gt[i]=0;                    // filling a kulhi or a taro field turns it into plain ground
  if(wasLand!==isLand)origin[i]=255;

}

// ---------- simulation ----------
function step(dt){

  assignWorkers();
  for(const isl of islands){isl.filled=0}
  for(const b of S.buildings){const d=DEF[b.type],isl=islands[b.isl];if(isl&&d.jobs&&!b.off)isl.filled+=b.staff*d.jobs}
  for(const isl of islands)isl.eff=isl.jobs?Math.min(1,isl.filled/isl.jobs):1;
  let income=0,upkeep=0;
  for(const b of S.buildings){
    const d=DEF[b.type];upkeep+=d.upkeep;
    const isl=islands[b.isl],st=stockOf(isl);
    if(b.type==='harbor'){b.status=b.merged?`Merged into the ${isl?.name} warehouse`:(berthOf(b.x,b.y)?'Berth open':'No deep-water berth');continue}
    if(!st){b.eff=0;b.status='No harbor on this island';continue}
    if(b.off){b.eff=0;b.rate=0;b.status='Paused';continue}
    const road=d.jobs?roadBeside(b):false,e=d.jobs?b.staff*(road?ROAD_BONUS:1):1;b.eff=d.jobs?b.staff:1;b.road=road;
    switch(b.type){

        const need=0.012*b.res*dt;let fed=false,lux=false;
        if(st.fish>=need){st.fish-=need;fed=true}
        const rn=0.005*b.res*dt;if(fed&&st.rum>=rn){st.rum-=rn;lux=true}
        const cap=lux?12:6;
        if(fed)b.res=b.res<cap?Math.min(cap,b.res+0.06*dt):Math.max(cap,b.res-0.04*dt);else b.res=Math.max(1,b.res-0.04*dt);
        if(fed)income+=TAX*b.res*(lux?2:1);
        b.status=!fed?'Hungry: needs fish':lux?'Fed and enjoying rum':'Fed (rum would double tax)';b.eff=fed?1:0.3;break}
      case'fishery':{const n=countAround(b.x,b.y,2,i=>S.h[i]===-1&&S.gt[i]!==GT.pond);const nur=Math.min(8,countAround(b.x,b.y,3,i=>S.gt[i]===GT.kulhi||S.gt[i]===GT.pond||S.gt[i]===GT.seagrass));

      case'lumber':{const n=countAround(b.x,b.y,2,i=>S.tree[i]>0);const r=0.03*Math.min(n,12)*e;st.wood+=r*dt;b.rate=r;b.status=n?`${n} trees in reach`:'No trees in reach';if(!n)b.eff=0;break}
      case'quarry':{const hv=S.h[idx(b.x,b.y)];const r=(0.15+0.05*(hv-2))*e;st.stone+=r*dt;b.rate=r;b.status=`Height ${hv} coral ridge`;break}
      case'plantation':{const near=countAround(b.x,b.y,2,i=>S.h[i]<0)>0;const r=0.12*(near?1.5:1)*e;st.sugar+=r*dt;b.rate=r;b.status=near?'Coastal soil, +50%':'Inland soil';break}
      case'distillery':{const want=0.2*e*dt;const take=Math.min(want,st.sugar);st.sugar-=take;st.rum+=take/2;S.stats.rum+=take/2;b.rate=take/2/dt;b.status=take<want*0.5?'Waiting for sugar':'Distilling';if(take<want*0.5)b.eff=0;break}
    }
    if(d.jobs&&b.staff<=0)b.status+=' · no residents within walking distance';else if(d.jobs&&b.staff<1)b.status+=` · ${Math.round(b.staff*100)}% staffed`;
  }

  S.rate=(S.rate??0)*0.9+(income-upkeep)*0.1;

// residents walk to the nearest jobs on their own island, up to WALK tiles; older buildings are staffed first
function assignWorkers(){
  const homes=S.buildings.filter(b=>b.type==='house').map(b=>({b,c:plotCentre(b),left:b.res}));
  for(const p of S.buildings){const d=DEF[p.type];if(!d.jobs)continue;p.staff=0;if(p.off)continue;
    const c=plotCentre(p);let need=d.jobs;
    const near=homes.map(h=>({h,dd:Math.hypot(h.c.x-c.x,h.c.y-c.y)})).filter(o=>o.h.left>0&&o.h.b.isl===p.isl&&o.dd<=WALK).sort((a,b)=>a.dd-b.dd);
    for(const{h}of near){const t=Math.min(need,h.left);h.left-=t;need-=t;if(need<=1e-6)break}
    p.staff=Math.max(0,(d.jobs-need)/d.jobs)}
}
function workersNear(x,y,isl){let n=0;for(const b of S.buildings)if(b.type==='house'&&b.isl===isl){const c=plotCentre(b);if(Math.hypot(c.x-x-.5,c.y-y-.5)<=WALK)n+=b.res}return n}

  for(let x=b.x;x<b.x+w;x++)for(const y of[b.y-1,b.y+d])if(inb(x,y)&&S.road[idx(x,y)])return true;
  for(let y=b.y;y<b.y+d;y++)for(const x of[b.x-1,b.x+w])if(inb(x,y)&&S.road[idx(x,y)])return true;
  return false}

const SHORE_GLSL=`
float shoreD(vec2 p){vec2 uv=p/vec2(${W}.,${H}.);if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.)return 6.;return texture2D(uShore,uv).r*9.-3.;}

    else if(S.road[i])h='<div class="t">Remove sand road</div><div>Refund 1 gold</div>';else h='<div class="t">Demolish</div><div class="sub">Nothing to remove here</div>'}
  else{const hv=S.h[i];h=`<div class="t">${TERRA[tool].name}${brush?` · ${['small','medium','large'][brush]} brush`:''}</div><div class="sub">${S.gt[i]?GT_NAME[S.gt[i]]:TERR_NAME(hv)} · height ${hv}</div>`;
    if(stroke&&(spend.g||spend.s))h+=`<div class="chips"><span class="chip">${ico('gold')}${Math.round(spend.g)}</span>${spend.s?`<span class="chip">${ico('stone')}${spend.s>0?'':'+'}${fmt(Math.abs(spend.s))}</span>`:''}</div>`;
    else h+=`<div class="chips">${chipsHTML(TOOL_COST[tool],stockOf(uiIsl))}<span class="sub">${tool==='road'?'per tile':'per step'}</span></div>`}
  if(tagErr&&tagErr.until>performance.now()){bad=true;h+=`<div class="why">${esc(tagErr.msg)}</div>`}
  if(h!==tagHTML){el.innerHTML=h;tagHTML=h}
  el.className=bad?'bad':'';el.hidden=false;
  const flip=mouse.x>innerWidth-290;el.style.left=mouse.x+'px';el.style.top=mouse.y+'px';el.style.transform=flip?'translate(calc(-100% - 16px),14px)':'';
}

// ----- help overlay (F1) -----

  closePops();
  const note=(id,title,text,place)=>{const r=$(id).getBoundingClientRect();return`<div class="note" style="${place(r)}"><b>${title}</b>${text}</div>`};

    note('bar','Build bar','Pick a category (1–6), then a building card. Hover a card for what it needs and makes. Right-click or Esc drops the tool.',r=>`left:${Math.max(8,r.left+r.width/2-120)}px;bottom:${H0-r.top+(openCat?90:14)}px`)+
    `<div class="keys pnl"><div class="hd"><h2>How to play</h2></div><table>
      <tr><td>Click</td><td>A building or an island's name for details</td></tr>
      <tr><td>Right or middle drag</td><td>Rotate and tilt (also Shift + drag)</td></tr>
      <tr><td>Wheel · WASD</td><td>Zoom · pan</td></tr>

      <tr><td>B · X · V</td><td>Brush size · demolish · survey</td></tr>

// ----- popovers -----
const POPS=[['menuBtn','menu'],['setBtn','settings'],['logBtn','log']];
function closePops(){for(const[b,p]of POPS){$(p).hidden=true;$(b).setAttribute('aria-expanded','false')}}
function togglePop(p){const was=!$(p).hidden;closePops();if(was)return;const b=POPS.find(x=>x[1]===p)[0];$(p).hidden=false;$(b).setAttribute('aria-expanded','true');
  if(p==='log'){unread=0;renderBadge();renderLog()}
  if(p==='menu'){newArmed=false;$('newLbl').textContent='New game';renderSaves()}}
function setUI(v){document.documentElement.style.setProperty('--ui',v);try{localStorage.setItem('islandsim.ui',v)}catch(e){}
  document.querySelectorAll('[data-ui]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.ui===+v))}
function escape(){
  if(!$('help').hidden)return toggleHelp(false);
  if(POPS.some(([,p])=>!$(p).hidden))return closePops();
  if(tool!=='inspect')return setTool('inspect');
  if(openCat)return setCat(null);
  if(sel)return closeSel();
  togglePop('menu');
}

// ----- saves: three slots and an autosave each minute, in this browser -----
const SLOTS=['islandsim.save1','islandsim.save2','islandsim.save3'],AUTO='islandsim.auto';let newArmed=false;
function slotMeta(key){try{return JSON.parse(localStorage.getItem(key+'.meta')||'null')}catch(e){return null}}
function saveTo(key){try{const meta={day:1+Math.floor(S.t/30),pop:Math.floor(totalPop()),at:Date.now()};localStorage.setItem(key,JSON.stringify(snapshot()));localStorage.setItem(key+'.meta',JSON.stringify(meta));return true}
  catch(e){toast('Could not save: this browser refused to store the game.','bad');return false}}
function renderSaves(){const row=(lbl,key,i)=>{const m=slotMeta(key);
    return`<div class="slot"><span><b>${lbl}</b> · ${m?`day ${m.day}, ${m.pop} residents`:'empty'}</span>${i!=='auto'?`<button data-save="${i}">Save</button>`:''}<button data-load="${i}"${m?'':' disabled'}>Load</button></div>`};
  $('saves').innerHTML=SLOTS.map((k,i)=>row(`Slot ${i+1}`,k,i)).join('')+row('Autosave',AUTO,'auto')}
function resetWorld(){for(const[,m]of bMeshes)scene.remove(m);bMeshes.clear();for(const[,m]of boatMeshes)scene.remove(m);boatMeshes.clear();boats=[];
  sel=null;renderSel();$('over').hidden=true;alerted.clear()}
function afterLoad(){dirtyTerrain=dirtyTrees=miniDirty=true;terrainVer++;setSpeed(1);updateUI()}
function loadFrom(key){let d=null;try{d=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(!d){toast('That save slot is empty.','bad');return false}
  const keep=S;try{resetWorld();restore(d)}catch(e){S=keep;computeIslands();afterLoad();toast('That save is from an older version and cannot be loaded.','bad');return false}
  afterLoad();toast(`Loaded day ${1+Math.floor(S.t/30)}.`,'good');return true}
function restartGame(){resetWorld();newGame();homeCam();afterLoad();toast('A new atoll. Palm Isle is yours again.','good')}
function gameOver(kind){S.over=kind;setSpeed(0);
  $('overT').textContent=kind==='bankrupt'?'The treasury is broken':'The islanders have deposed you';
  $('overWhy').textContent=kind==='bankrupt'?`Debts passed ${-DEBT_LIMIT} gold, so the sultan has handed the atoll to another governor.`:'Too many families went hungry for too long. The island chiefs have chosen a new governor.';
  $('overStats').textContent=`You lasted ${1+Math.floor(S.t/30)} day${Math.floor(S.t/30)?'s':''} and housed ${Math.floor(totalPop())} residents. Charter goals met: ${GOALS.filter(g=>S.goals[g.id]).length} of ${GOALS.length}.`;
  $('over').hidden=false;$('overNew').focus()}

function initUI(){
  document.querySelectorAll('[data-ico]').forEach(el=>el.innerHTML=ico(el.dataset.ico));
  renderBar();renderRes();
  $('hud').addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.cat)return setCat(openCat===t.dataset.cat?null:t.dataset.cat);
    if(t.dataset.tool)return setTool(t.dataset.tool);
    if(t.dataset.brush)return setBrush(+t.dataset.brush);
    if(t.dataset.speed)return setSpeed(+t.dataset.speed);
    if(t.dataset.q)return setQuality(t.dataset.q);
    if(t.dataset.ui)return setUI(t.dataset.ui);
    if(t.closest('#sel')&&t.dataset.act)return selAction(t.dataset.act,t);
    if(t.dataset.log){const m=LOG[+t.dataset.log];if(m?.at)jumpTo(m.at.x,m.at.y);return}
    if(t.dataset.act==='help'){closePops();return toggleHelp(true)}
    if(t.dataset.act==='home'){closePops();return homeCam()}
    if(t.dataset.act==='settings')return togglePop('settings');
    if(t.dataset.act==='new'){if(!newArmed){newArmed=true;$('newLbl').textContent='Click again to start over';return}closePops();return restartGame()}
    if(t.dataset.save){saveTo(SLOTS[+t.dataset.save]);toast(`Saved to slot ${+t.dataset.save+1}.`,'good');return renderSaves()}
    if(t.dataset.load){closePops();return loadFrom(t.dataset.load==='auto'?AUTO:SLOTS[+t.dataset.load])}
    if(t.closest('#res'))return uiIsl&&openIsland(uiIsl);
  });
  for(const[b,p]of POPS)$(b).addEventListener('click',()=>togglePop(p));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pop,.ib'))closePops()});
  $('help').addEventListener('click',()=>toggleHelp(false));
  $('overNew').addEventListener('click',restartGame);
  $('overLoad').addEventListener('click',()=>{$('over').hidden=true;togglePop('menu')});
  $('charterToggle').addEventListener('click',()=>{const o=$('goals').hidden;$('goals').hidden=!o;$('charterToggle').setAttribute('aria-expanded',o);$('charterToggle').textContent=o?'▴':'▾'});
  $('mapToggle').addEventListener('click',()=>{const m=$('mapbox');m.classList.toggle('open');$('mapToggle').setAttribute('aria-expanded',m.classList.contains('open'))});
  const mini=$('mini');let md=false;
  mini.addEventListener('pointerdown',e=>{md=true;mini.setPointerCapture(e.pointerId);miniJump(e)});
  mini.addEventListener('pointermove',e=>{if(md)miniJump(e)});
  mini.addEventListener('pointerup',()=>md=false);mini.addEventListener('pointercancel',()=>md=false);
  $('north').addEventListener('click',()=>{cam.goal=Math.round(cam.yaw/(Math.PI*2))*Math.PI*2});
  $('home').addEventListener('click',homeCam);
  // rotate buttons: a tap turns 45° smoothly, holding spins until released
  [['rotL',1],['rotR',-1]].forEach(([id,dir])=>{const b=$(id);let t0=0;
    b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);t0=performance.now();cam.spin=dir;cam.goal=null});
    const up=()=>{if(!cam.spin)return;cam.spin=0;if(performance.now()-t0<280)cam.goal=Math.round((cam.yaw+dir*Math.PI/4)/(Math.PI/4))*(Math.PI/4)};
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();cam.goal=(cam.goal??cam.yaw)+dir*Math.PI/4}})});
  // tooltips
  const hud=$('hud');
  hud.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-tip]');if(el&&el!==tipFor)showTip(el);else if(!el&&tipFor)hideTip()});
  hud.addEventListener('pointerleave',hideTip);
  hud.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);else hideTip()});
  hud.addEventListener('focusout',hideTip);
  hud.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest('[data-tip]');if(el)tipTimer=setTimeout(()=>showTip(el),500)});
  hud.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){clearTimeout(tipTimer);setTimeout(hideTip,1500)}});
  let ui=1;try{ui=+(localStorage.getItem('islandsim.ui')||1)}catch(e){}setUI(ui);
  renderCards();
}
function updateUI(){
  const vi=viewIsland();uiIsl=vi;
  $('islName').textContent=vi?vi.name:'No harbor';
  setCtr('gold',fmt(S.gold),(S.rate||0)*60,S.gold<0);
  const st=stockOf(vi),fl=flows(vi);let scarce=null,best=1e9;
  for(const g of GOODS){if(fl[g].use>0){const c=(st?st[g]:0)/fl[g].use;if(c<best){best=c;scarce=g}}}
  for(const g of GOODS)setCtr(g,st?fmt(st[g]):'–',(fl[g].make-fl[g].use)*60,st&&st[g]<1&&fl[g].use>0,g===scarce);
  setCtr('pop',Math.floor(totalPop()));
  const un=S.unrest||0,ue=document.querySelector('.ctr[data-k="unrest"]');ue.hidden=un<5;setCtr('unrest',Math.round(un)+'%',0,un>=50);
  $('sDay').textContent=1+Math.floor(S.t/30);
  renderCharter();updateChips();renderSel();
  if(tipFor&&!tipFor.isConnected)hideTip();else if(tipFor)$('tip').innerHTML=tipHTML(tipFor.dataset.tip)||$('tip').innerHTML;
}
// floating island labels (click for the island panel); zoomed far out, atoll names replace them
const labelName=k=>S.names?.['k'+k]||ISL[k].name;
const labelEls=ISL.map((I,k)=>{const d=document.createElement('button');d.className='lbl';d.textContent=I.name;
  d.addEventListener('click',()=>{const a=islAnchor[k];if(a)openIsland(islandOf(a.x,a.y))});$('labels').appendChild(d);return d});
const atollEls=ATOLLS.map(A=>{const d=document.createElement('button');d.className='lbl atl';d.textContent=A.name;
  d.addEventListener('click',()=>{cam.goal=null;cam.tx=A.x;cam.tz=A.y;cam.dist=Math.min(cam.dist,A.lone?90:200)});$('labels').appendChild(d);return d});
const v3=new THREE.Vector3();
function placeLabel(el,x,y,hgt){v3.set(x,hgt,y).project(camera);
  if(v3.z>1||Math.abs(v3.x)>1.1||Math.abs(v3.y)>1.1){el.hidden=true;return}
  el.hidden=false;el.style.left=((v3.x+1)/2*vw)+'px';el.style.top=((1-v3.y)/2*vh)+'px'}
function updateLabels(){
  const far=cam.dist>280,close=cam.dist<210;
  ISL.forEach((I,k)=>{const a=islAnchor[k],el=labelEls[k];if(far||!a){el.hidden=true;return}
    const nm=labelName(k);if(el.textContent!==nm)el.textContent=nm;
    const isl=islandOf(a.x,a.y),mid=isl&&isl.parts.length===1&&I.kind!=='vilu'?{x:isl.cx,y:isl.cy}:ISL_C[k];placeLabel(el,mid.x+.5,mid.y+.5,topY(2)+2.2)});
  ATOLLS.forEach((A,k)=>{const el=atollEls[k];if(close){el.hidden=true;return}placeLabel(el,A.x,A.y-(A.lone?A.R+4:0),A.lone?6:2)});
}

function setQuality(n){Q=QUALITY[n];qName=n;try{localStorage.setItem('islandsim.quality',n)}catch(e){}
  document.querySelectorAll('[data-q]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.q===n));applyQuality()}
// ---------- persistence for live updates ----------
// tile layers are run-length packed and base64'd: a 720×500 world would not fit browser storage as plain arrays
function pack(a,off=0){const out=[];for(let i=0;i<a.length;){const v=(a[i]+off)&255;let n=1;while(i+n<a.length&&n<255&&((a[i+n]+off)&255)===v)n++;out.push(v,n);i+=n}
  const u=new Uint8Array(out);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unpack(str,T,len,off=0){const b=atob(str),a=new T(len);let k=0;for(let i=0;i<b.length;i+=2){const n=b.charCodeAt(i+1);a.fill(b.charCodeAt(i)-off,k,k+n);k+=n}
  if(k!==len)throw new Error('bad save');return a}
function snapshot(){return{v:6,dims:[W,H],names:S.names,h:pack(S.h,128),tree:pack(S.tree),road:pack(S.road),gt:pack(S.gt),buildings:S.buildings.map(b=>({id:b.id,type:b.type,x:b.x,y:b.y,w:b.w,d:b.d,res:b.res,stock:b.stock,off:b.off})),gold:S.gold,t:S.t,nextId:S.nextId,stats:S.stats,goals:S.goals,capital:S.capital,unrest:S.unrest||0,origin:pack(origin),cam:{...cam}}}
function restore(d){
  if(d.v!==6||!d.h||d.dims?.[0]!==W||d.dims?.[1]!==H)throw new Error('old save');
  S={h:unpack(d.h,Int8Array,W*H,128),tree:unpack(d.tree,Uint8Array,W*H),road:unpack(d.road,Uint8Array,W*H),gt:unpack(d.gt,Uint8Array,W*H),bld:new Int32Array(W*H).fill(-1),buildings:[],gold:d.gold,t:d.t,nextId:d.nextId,stats:d.stats,goals:d.goals,capital:d.capital,unrest:d.unrest||0,names:d.names||{},over:null};
  origin=unpack(d.origin,Uint8Array,W*H);
  for(const b of d.buildings){const nb={w:1,d:1,...b,eff:0,status:''};S.buildings.push(nb);for(let ty=nb.y;ty<nb.y+nb.d;ty++)for(let tx=nb.x;tx<nb.x+nb.w;tx++)S.bld[idx(tx,ty)]=b.id}
  if(d.cam)Object.assign(cam,d.cam);
  computeIslands();
}


// ---------- loop ----------
let last=0,acc=0,uiT=0,goalT=0,miniT=0,alertT=0,autoT=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(.1,t-(last||t));last=t;
  const kp=600*dt;
  if(keys.has('w')||keys.has('arrowup'))panBy(0,kp);
  if(keys.has('s')||keys.has('arrowdown'))panBy(0,-kp);
  if(keys.has('a')||keys.has('arrowleft'))panBy(kp,0);
  if(keys.has('d')||keys.has('arrowright'))panBy(-kp,0);
  if(keys.has('q')||keys.has('e')||cam.spin){cam.goal=null;cam.yaw+=1.6*dt*((keys.has('q')?1:0)-(keys.has('e')?1:0)+(cam.spin||0))}
  if(cam.goal!=null){const d=cam.goal-cam.yaw;cam.yaw+=d*Math.min(1,dt*9);if(Math.abs(d)<.002){cam.yaw=cam.goal;cam.goal=null}}
  if(S.over)acc=0;else acc+=dt*speed;let n=0;while(acc>=.1&&n<20){step(.1);acc-=.1;n++}if(n>=20)acc=0;
  uiT+=dt;if(uiT>.25){uiT=0;updateUI()}
  miniT+=dt;if(miniT>.2){miniT=0;drawMini()}
  alertT+=dt;if(alertT>3){alertT=0;checkAlerts()}
  autoT+=dt;if(autoT>60){autoT=0;if(!S.over)saveTo(AUTO)}
  goalT+=dt;if(goalT>.5){goalT=0;checkGoals()}
  if(dirtyTerrain||tDirty)rebuildTerrain();
  if(dirtyTrees||vDirty)rebuildTrees();
  cullVeg();
  syncBuildings(t);syncBoats3D(t);G.uTime.value=t;
  hideGhosts();cursor.visible=false;rangeQuad.visible=false;
  if(hover){
    const gy=Math.max(WATER_Y,topY(S.h[idx(hover.x,hover.y)]));
    if(tool in DEF){const r=canPlace(tool,hover.x,hover.y),ok=r.ok;const g=ghost(tool);g.visible=true;
      const fp=r.fp||footprint(tool,hover.x,hover.y);g.position.set(fp.x+fp.w/2,gy,fp.y+fp.d/2);if(DEF[tool].size)g.rotation.y=fp.w>=fp.d?0:Math.PI/2;
      g.traverse(o=>{if(o.isMesh)o.material=ok?ghostOk:ghostBad});
      if(['fishery','lumber','plantation'].includes(tool)){rangeQuad.visible=true;rangeQuad.position.set(hover.x+.5,gy+.05,hover.y+.5)}}
    else placeCursor(hover.x,hover.y,(tool==='inspect'||tool==='demolish')?0:brush,tool==='raise'?'#ffcf5a':tool==='lower'?'#4fd1c5':tool==='demolish'?'#ff6b6b':'#f3e6c4');
  }
  const sb=sel?.kind==='b'?byId(sel.id):null;selBox.visible=!!sb;
  if(sb){selBox.scale.set(sb.w||1,1,sb.d||1);const c=plotCentre(sb);selBox.position.set(c.x,topY(S.h[idx(sb.x,sb.y)])+.25,c.y)}
  applyCam();placeSun();sky.position.copy(camera.position);renderFrame();updateLabels();updateTag();
  $('north').firstChild.style.transform=`rotate(${cam.yaw}rad)`;
  requestAnimationFrame(frame);
}
async function start(data){
  initUI();
  document.querySelectorAll('[data-q]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.q===qName));
  applyQuality();
  try{[groundAlb.value,groundNor.value]=await Promise.all([loadArray(LAYERS.map(n=>n+'_albedo.jpg'),true),loadArray(LAYERS.map(n=>n+'_normal.jpg'),false)])}
  catch(e){$('loading').textContent='Some textures could not load. Check your connection and reload.';return}
  let restored=false;
  if(data&&data.h){try{restore(data);restored=true}catch(e){}}
  let auto=false;
  if(!restored){try{const a=JSON.parse(localStorage.getItem(AUTO)||'null');if(a){restore(a);auto=true;restored=true}}catch(e){}}
  if(!restored){newGame();homeCam()}
  setTool('inspect');updateUI();
  window.addEventListener('resize',resize);
  window.claude?.hot?.snapshot?.(snapshot);
  $('loading').hidden=true;
  toast(auto?`Welcome back, governor. Your autosave from day ${1+Math.floor(S.t/30)} is loaded; the menu starts a new game.`:'Welcome, governor. Palm Isle is yours. Reshape the reef and lagoon to bind the atoll together; two more atolls and a lone island lie beyond the reef.','good');
  window.__island={S:()=>S,drawMini,paintMiniBase,vChunks,saveTo,loadFrom,restartGame,gameOver,roadBeside,selectBuilding,openIsland,setCat,toggleHelp,byId,buildRoad,islands:()=>islands,boats:()=>boats,setTool,place,terraform,step,computeIslands,setSpeed,cam,setQuality,renderer,W,H,ATOLLS,ISL,ISL_C,GT,rebuildTerrain,markTerrain,markShore,computeShore,rebuildTrees,snapshot,restore,ready:true};
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
